server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:21d}
      cookie:
        name: TAVERNA_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

spring:
  application:
    name: taverna-shlyapnika-backend
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

taverna:
  site-base-url: ${SITE_BASE_URL:http://localhost:8080}
  public-uploads-url: ${PUBLIC_UPLOADS_URL:http://localhost:8080/uploads}
  file-storage-dir: ${FILE_STORAGE_DIR:uploads}
  timezone: ${TAVERN_TIMEZONE:Europe/Minsk}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${SITE_ORIGINS:http://localhost:4177}}
  internal-api-token: ${BOT_BACKEND_SECRET:${INTERNAL_API_TOKEN:change-me-local-token}}
  master-access-code: ${MASTER_ACCESS_CODE:}
  hatter-access-code: ${HATTER_ACCESS_CODE:}
  hatter-telegram-user-id: ${HATTER_TELEGRAM_USER_ID:${ADMIN_TELEGRAM_IDS:}}
  auto-publish: ${AUTO_PUBLISH:true}
  serve-frontend: ${SERVE_FRONTEND:false}
  frontend-static-dir: ${FRONTEND_STATIC_DIR:static-site}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    admin-ids: ${ADMIN_TELEGRAM_IDS:}
    admin-usernames: ${ADMIN_TELEGRAM_USERNAMES:}
  media:
    storage: ${MEDIA_STORAGE:local}
