server:
  port: ${PORT:4192}

spring:
  application:
    name: character-service
  datasource:
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    enabled: ${CHARACTER_SWAGGER_UI_ENABLED:true}

character-service:
  cors-allowed-origins: ${CHARACTER_CORS_ALLOWED_ORIGINS:http://localhost:4177,http://localhost:4191,http://localhost:4192}
  api-token: ${CHARACTER_API_TOKEN:}
