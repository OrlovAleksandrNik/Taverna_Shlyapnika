spring:
  datasource:
    url: jdbc:h2:mem:control;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

control:
  frontend-origin: http://localhost:4191
  encryption-key: dev-test-encryption-key-32-bytes
