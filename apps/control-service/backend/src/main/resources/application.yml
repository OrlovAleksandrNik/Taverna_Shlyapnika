server:
  port: ${PORT:4190}
  servlet:
    session:
      cookie:
        name: CONTROLSESSION
        http-only: true
        same-site: strict
        secure: ${CONTROL_COOKIE_SECURE:false}

spring:
  application:
    name: control-service-backend
  datasource:
    url: ${CONTROL_DATABASE_URL:jdbc:postgresql://localhost:5434/taverna_control}
    username: ${CONTROL_DATABASE_USERNAME:control}
    password: ${CONTROL_DATABASE_PASSWORD:control}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    enabled: ${CONTROL_SWAGGER_UI_ENABLED:true}

control:
  public-url: ${CONTROL_PUBLIC_URL:http://localhost:4191}
  frontend-origin: ${CONTROL_FRONTEND_ORIGIN:http://localhost:4191}
  session-secret: ${CONTROL_SESSION_SECRET:change-this-session-secret}
  encryption-key: ${CONTROL_ENCRYPTION_KEY:dev-only-32-byte-key-change-now}
  public-registration-enabled: ${PUBLIC_REGISTRATION_ENABLED:false}
  main-site-integration-enabled: ${CONTROL_MAIN_SITE_INTEGRATION_ENABLED:false}
  telegram-integration-enabled: ${CONTROL_TELEGRAM_INTEGRATION_ENABLED:false}
  desktop-agent-enabled: ${CONTROL_DESKTOP_AGENT_ENABLED:false}
  media-storage-root: ${CONTROL_MEDIA_STORAGE_ROOT:./.control-data/media}
  backup-storage-root: ${CONTROL_BACKUP_STORAGE_ROOT:./.control-data/backups}
  bootstrap-owner-email: ${CONTROL_BOOTSTRAP_OWNER_EMAIL:}
  bootstrap-token: ${CONTROL_BOOTSTRAP_TOKEN:}
  mail:
    provider: ${CONTROL_MAIL_PROVIDER:mock}
    host: ${CONTROL_MAIL_HOST:localhost}
    port: ${CONTROL_MAIL_PORT:1025}
    username: ${CONTROL_MAIL_USERNAME:}
    password: ${CONTROL_MAIL_PASSWORD:}
    from: ${CONTROL_MAIL_FROM:no-reply@taverna-control.local}
    start-tls: ${CONTROL_MAIL_START_TLS:false}
  desktop-agent:
    launch-paths:
      voicemod: ${CONTROL_DESKTOP_AGENT_VOICEMOD_PATH:}
      screenstage: ${CONTROL_DESKTOP_AGENT_SCREENSTAGE_PATH:}
