services:
  control-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taverna_control
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${CONTROL_DATABASE_PASSWORD:-control}
    ports:
      - "5434:5432"
    volumes:
      - control_postgres:/var/lib/postgresql/data

  control-mail-dev:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "4192:8025"

  control-backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    environment:
      CONTROL_DATABASE_URL: jdbc:postgresql://control-postgres:5432/taverna_control
      CONTROL_FRONTEND_ORIGIN: http://localhost:4191
    ports:
      - "4190:4190"
    depends_on:
      - control-postgres
      - control-mail-dev
    volumes:
      - control_media:/data/media
      - control_backups:/data/backups

  control-frontend:
    build:
      context: ./frontend
    ports:
      - "4191:80"
    depends_on:
      - control-backend

volumes:
  control_postgres:
  control_media:
  control_backups:
