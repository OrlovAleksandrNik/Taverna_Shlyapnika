<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смена пароля | Таверна Шляпника</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" data-header></header>
  <main id="top">
    <section class="archive-hero">
      <div class="archive-hero-content page-container">
        <p class="eyebrow">Восстановление доступа</p>
        <h1>Сменить пароль</h1>
        <p>Введите новый пароль для аккаунта Таверны. Ссылка действует ограниченное время и срабатывает только один раз.</p>
        <form class="request-form diary-auth-form" data-reset-password-form>
          <input name="token" type="hidden">
          <label class="form-wide">Новый пароль<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="160" required></label>
          <label class="form-wide">Повторите новый пароль<input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="160" required></label>
          <button class="button primary" type="submit">Сменить пароль</button>
          <p class="form-status" data-form-status></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <div class="modal-backdrop" data-modal hidden></div>
  <script src="data/site-settings.js"></script>
  <script src="data/masters.js"></script>
  <script src="data/hatter-diary.js"></script>
  <script src="script.js"></script>
</body>
</html>
